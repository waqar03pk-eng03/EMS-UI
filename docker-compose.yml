services:
  mongo:
    image: mongo:7
    container_name: ems-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-ems_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-ems_password}
    volumes:
      - ems-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: api
    image: ems-api:local
    container_name: ems-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:8080
      # "mongo" is the service name; containers reach each other by service name.
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-ems_admin}:${MONGO_ROOT_PASSWORD:-ems_password}@mongo:27017/ems?authSource=admin
    ports:
      - "4000:4000"   # optional: lets you call the API directly while testing
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ui:
    build:
      context: .
      target: ui
    image: ems-ui:local
    container_name: ems-ui
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  ems-mongo-data:
